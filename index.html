<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Flight Simulator with Dogfight AI</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; }
        #hud { position: absolute; top: 10px; left: 10px; color: #fff; text-shadow: 1px 1px 2px #000; pointer-events: none; }
        #controls { position: absolute; bottom: 10px; left: 10px; color: #ccc; font-size: 13px; background: rgba(0,0,0,0.5); padding: 8px; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="hud">
        <h2 style="margin:0 0 5px 0;">FLIGHT SIMULATOR</h2>
        <p style="margin:2px 0;">Autopilot: <span id="autofly-status" style="color:#0f0;">OFF</span></p>
        <p style="margin:2px 0;">Active Enemy AI: <span id="bot-count">0</span></p>
    </div>
    <div id="controls">
        <b>Controls:</b> [W/S] Pitch | [A/D] Roll | [Q/E] Yaw | [Space] Shoot | [F] Toggle Auto-Fly
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- 1. SCENE & LIGHTING SETUP ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.0008);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 3000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Sunlight & Ambient Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffaed, 1.3);
        sunLight.position.set(200, 500, 200);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // Dynamic Muzzle Flash Light
        const muzzleLight = new THREE.PointLight(0xffaa00, 0, 40);
        scene.add(muzzleLight);

        // Ground Plane
        const groundGeo = new THREE.PlaneGeometry(10000, 10000);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x2e4c1e, roughness: 0.9 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -100;
        scene.add(ground);

        // --- 2. PLANE MESH GENERATOR ---
        function createAircraftMesh(colorHex) {
            const group = new THREE.Group();
            
            // Fuselage
            const bodyGeo = new THREE.ConeGeometry(1.2, 7, 8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, metalness: 0.3, roughness: 0.5 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.rotation.x = Math.PI / 2;
            group.add(body);

            // Wings
            const wingGeo = new THREE.BoxGeometry(8, 0.1, 1.8);
            const wingMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
            const wings = new THREE.Mesh(wingGeo, wingMat);
            wings.position.z = -0.5;
            group.add(wings);

            return group;
        }

        // --- 3. PLAYER SETUP (NO ACCOUNTS NEEDED) ---
        const player = createAircraftMesh(0x1e88e5);
        player.position.set(0, 100, 0);
        scene.add(player);

        let pitch = 0, roll = 0, yaw = 0;
        let targetPitch = 0, targetRoll = 0, targetYaw = 0;
        let autoFly = false;
        let recoilKick = 0;
        let lastFireTime = 0;

        const bullets = [];
        const bots = [];
        const keys = {};

        // --- 4. BOT AI SYSTEM ---
        function spawnAIBot() {
            const botMesh = createAircraftMesh(0xe53935);
            botMesh.position.set(
                (Math.random() - 0.5) * 800,
                80 + Math.random() * 100,
                (Math.random() - 0.5) * 800
            );
            scene.add(botMesh);
            bots.push({ mesh: botMesh, speed: 1.1, fireCooldown: 0 });
            document.getElementById('bot-count').innerText = bots.length;
        }

        // Auto-fill lobby with 3 bots on start
        for (let i = 0; i < 3; i++) spawnAIBot();

        // Key Listeners
        window.addEventListener('keydown', e => {
            const k = e.key.toLowerCase();
            keys[k] = true;
            if (k === 'f') {
                autoFly = !autoFly;
                const status = document.getElementById('autofly-status');
                status.innerText = autoFly ? "ON (Autopilot Active)" : "OFF";
                status.style.color = autoFly ? "#00ffff" : "#00ff00";
            }
        });
        window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

        // --- 5. SHOOTING MECHANICS ---
        function fireWeapon(sourceMesh, isPlayer = false) {
            const bulletGeo = new THREE.SphereGeometry(0.35, 8, 8);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffeb3b });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);

            bullet.position.copy(sourceMesh.position);
            bullet.quaternion.copy(sourceMesh.quaternion);

            // Forward vector trajectory
            const forward = new THREE.Vector3(0, 0, 1).applyQuaternion(sourceMesh.quaternion);
            bullet.userData = { velocity: forward.multiplyScalar(4.5), life: 90 };

            scene.add(bullet);
            bullets.push(bullet);

            if (isPlayer) {
                // Muzzle Flash Effect
                muzzleLight.position.copy(player.position);
                muzzleLight.intensity = 6;
                
                // Recoil Pitch Shift
                recoilKick = 0.025;
            }
        }

        // --- 6. MAIN GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            // Control Interpolation Smoothing
            const lerpSpeed = 0.05;

            if (autoFly) {
                // Auto-fly: Auto-level roll/yaw and balance target altitude
                targetPitch = THREE.MathUtils.clamp((120 - player.position.y) * 0.01, -0.02, 0.02);
                targetRoll = -roll * 0.1;
                targetYaw = 0;
            } else {
                // Manual inputs
                targetPitch = (keys['w'] ? 0.025 : 0) + (keys['s'] ? -0.025 : 0);
                targetRoll = (keys['a'] ? 0.035 : 0) + (keys['d'] ? -0.035 : 0);
                targetYaw = (keys['q'] ? 0.015 : 0) + (keys['e'] ? -0.015 : 0);
            }

            // Apply Recoil Kickback to Pitch
            if (recoilKick > 0) {
                targetPitch += recoilKick;
                recoilKick *= 0.82;
            }

            // Smooth rotational easing
            pitch += (targetPitch - pitch) * lerpSpeed;
            roll += (targetRoll - roll) * lerpSpeed;
            yaw += (targetYaw - yaw) * lerpSpeed;

            player.rotateX(pitch);
            player.rotateZ(roll);
            player.rotateY(yaw);
            player.translateZ(1.3); // Constant speed flight physics

            // Light Decay
            if (muzzleLight.intensity > 0) muzzleLight.intensity *= 0.65;

            // Player Firing Trigger
            if (keys[' ']) {
                const now = Date.now();
                if (now - lastFireTime > 120) {
                    fireWeapon(player, true);
                    lastFireTime = now;
                }
            }

            // --- AI BOTS BEHAVIOR & DOGFIGHTING ---
            bots.forEach(bot => {
                const botPos = bot.mesh.position;
                
                // Orient towards player
                const targetMatrix = new THREE.Matrix4().lookAt(botPos, player.position, new THREE.Vector3(0, 1, 0));
                const targetRotation = new THREE.Quaternion().setFromRotationMatrix(targetMatrix);
                
                // Smooth AI steering
                bot.mesh.quaternion.slerp(targetRotation, 0.02);
                bot.mesh.translateZ(bot.speed);

                // AI Shooting Decision Logic
                bot.fireCooldown++;
                if (botPos.distanceTo(player.position) < 350 && bot.fireCooldown > 80) {
                    fireWeapon(bot.mesh, false);
                    bot.fireCooldown = 0;
                }
            });

            // --- BULLET TRAJECTORY & GRAVITY DROP ---
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.position.add(b.userData.velocity);
                
                // Realistic ballistics gravity pull
                b.userData.velocity.y -= 0.008; 
                b.userData.life--;

                if (b.userData.life <= 0) {
                    scene.remove(b);
                    bullets.splice(i, 1);
                }
            }

            // --- CAMERA SMOOTH FOLLOW ---
            const offset = new THREE.Vector3(0, 4, -16).applyQuaternion(player.quaternion);
            camera.position.copy(player.position).add(offset);
            camera.lookAt(player.position.clone().add(new THREE.Vector3(0, 1.5, 10).applyQuaternion(player.quaternion)));

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
